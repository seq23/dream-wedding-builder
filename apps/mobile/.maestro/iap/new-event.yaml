# IAP review shot (c): More > "Start a new event ›" for a Full plan owner, selling dw_new_event
# ("Full plan for a new event") at the App Store's price. Same seeded owner as owner-extras.yaml.
appId: com.weddingchecklistpdf.dreamwedding
---
- launchApp
- tapOn:
    text: "Don’t Allow"
    optional: true
# The "☰ More" tab, by its place in the tab bar on the 6.9-inch iPhone the job boots (its accessibility
# text carries the tab role, so a text match is not exact); the next step proves the More screen opened.
- tapOn:
    point: "86%,94%"
- scrollUntilVisible:
    element: "Start a new event ›"
    direction: DOWN
- tapOn: "Start a new event ›"
- extendedWaitUntil:
    visible: "Full plan for a new event"
    timeout: 30000
- extendedWaitUntil:
    visible: "\\$14\\.99"
    timeout: 90000
- takeScreenshot: iap-c-top
- scrollUntilVisible:
    element: "Start my new event ›"
    direction: DOWN
    centerElement: true
- takeScreenshot: iap-c-offers
