# IAP review shot (b): the same screen for a Full plan owner (More > "Add printables to my plan ›"), showing
# dw_printables_topup and dw_day_of_kit with the App Store's prices. Storage seeded by the workflow: one paid
# event, as the purchase door leaves it after a verified Full plan purchase.
appId: com.weddingchecklistpdf.dreamwedding
---
- launchApp
- tapOn:
    text: "Don’t Allow"
    optional: true
# The plan has finished loading before the tab is tapped (a tap while it renders is lost).
- extendedWaitUntil:
    visible: "Your plan"
    timeout: 30000
# The tab's whole accessibility text (Maestro matches the full text; iOS adds the tab role).
- tapOn: "☰ More, tab, 4 of 4"
- scrollUntilVisible:
    element: "Add printables to my plan ›"
    direction: DOWN
- tapOn: "Add printables to my plan ›"
# Each offer card is one radio, so iOS reads it as one text: its name, what it holds, then the store price.
- extendedWaitUntil:
    visible: ".*Printables, Files to print.*, \\$19\\.99"
    timeout: 90000
- assertVisible: ".*Day-of kit, For the day itself.*, \\$9\\.99"
- takeScreenshot: iap-b-top
- scrollUntilVisible:
    element: "Choose one above"
    direction: DOWN
    centerElement: true
- takeScreenshot: iap-b-offers
