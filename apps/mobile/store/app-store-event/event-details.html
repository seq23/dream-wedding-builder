<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<!-- Apple In-App Event media (1080 x 1920). Apple draws the event name and description over the lower
third, so the art keeps that area clear and carries no words of its own except the plan tabs. -->
<style>html,body{margin:0;width:1080px;height:1920px;background:#FAF7F2;overflow:hidden}
.w{position:absolute;inset:0 0 34% 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:60px}
.tabs{font:500 27px "DM Mono",monospace;letter-spacing:.12em;text-transform:uppercase;display:flex;gap:12px}
.tabs span{padding:15px 21px;border-radius:12px 12px 0 0;background:#F28C6B;color:#1B1F3B}.tabs span.on{background:#2747D9;color:#fff}
.sheet{width:756px;border-top:9px solid #2747D9;display:grid;gap:24px;padding-top:36px}
.row{display:flex;align-items:center;gap:27px}.box{width:49px;height:49px;border:4px solid #1B1F3B;border-radius:6px;box-sizing:border-box}
.box.on{background:#2F6B4A;border-color:#2F6B4A}.line{height:15px;border-radius:99px;background:#1B1F3B;opacity:.18;flex:1}
</style></head><body><div class="w">
<svg width="216" height="216" viewBox="0 0 64 64"><path d="M24 8H44A8 8 0 0 1 52 16V56H24Z" fill="#F28C6B"/><path d="M12 18H32A8 8 0 0 1 40 26V64H12Z" fill="#2747D9"/></svg>
<div class="tabs"><span class="on">12+ months</span><span>9 months</span><span>6 months</span><span>Wedding week</span></div>
<div class="sheet"><div class="row"><div class="box on"></div><div class="line"></div></div><div class="row"><div class="box"></div><div class="line" style="flex:.8"></div></div><div class="row"><div class="box"></div><div class="line" style="flex:.6"></div></div></div>
</div></body></html>
