name: CI - Build and Validate

# The schedule is not redundant with `push`.
#
# Three lanes commit to main with GITHUB_TOKEN (full-safe-autonomy, search
# intelligence, self-heal), and a push made with GITHUB_TOKEN does not trigger
# workflows. On 2026-08-29 three bot commits landed on main - 4401e07, cd5e561
# and 3f5cf9c - and no CI run exists for any of them; the last CI run on main was
# from the previous day's human push. Everything those lanes write to main was
# therefore unverified by this gate until the next person happened to push.
# 12:40 UTC is after the daily publishing lane (10:17) and the search
# intelligence lane (11:41) have finished committing.
on:
  push:
  pull_request:
  schedule:
    - cron: '40 12 * * *'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because validate:cadence-policy re-derives publishing
      # capacity from the committed history of data/authority/content_registry.json.
      # Under a depth-1 checkout there is no history to measure and the check
      # hard-fails rather than passing on the one visible commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - run: npm run validate:all
      - run: npm run build
      # Severity-aware pass: reports non-blocking warnings that validate:all would
      # either ignore or hard-fail on. See _repo_validation_registry.json.
      #
      # This runs AFTER the build. validate:internal-links boots the built site,
      # reads each host's real sitemap and crawls it, so it needs .next to exist;
      # with no build it hard-fails rather than skipping, which is correct for the
      # gate and wrong for this step's position in the job. Everything else in the
      # registry is indifferent to build order.
      - run: npm run validate:registry
      # The 200-in-build assertion in validate:amazon-paths can only run once the
      # build exists. validate:all above runs before the build, so that assertion
      # was reported as unproven and never actually executed in CI. Re-run just
      # that gate here in strict mode, where an absent build is a hard failure.
      # The five paths are printed inside already-published EPUBs: if one stops
      # rendering, the only remedy is re-uploading five books.
      - name: Amazon landing paths (strict, post-build)
        run: REQUIRE_BUILD_OUTPUT=1 npm run validate:amazon-paths
      - name: Cadence gate
        # Blocks publishing faster than the library can be kept inside the
        # 91-day window where pages stay citable. Warnings are reported
        # without failing the run.
        run: npm run cadence:gate
