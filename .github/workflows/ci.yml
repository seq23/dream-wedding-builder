name: CI - Build and Validate
on: [push, pull_request]
permissions: { contents: read }
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - run: npm run validate:all
      # Severity-aware pass: reports non-blocking warnings that validate:all would
      # either ignore or hard-fail on. See _repo_validation_registry.json.
      - run: npm run validate:registry
      - run: npm run build
