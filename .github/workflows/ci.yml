name: CI - Build and Validate
on: [push, pull_request]
permissions: { contents: read }
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - run: npm run validate:all
      - run: npm run build
