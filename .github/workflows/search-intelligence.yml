name: Search Intelligence - Observe Diagnose Repair Retest
on:
  workflow_dispatch:
  schedule:
    - cron: '41 11 * * *'
permissions:
  contents: write
concurrency:
  group: dream-wedding-search-intelligence
  cancel-in-progress: false
jobs:
  search-intelligence:
    timeout-minutes: 5  # ~3x median 0.8m over 8 green runs; fault detector, not a budget
    if: ${{ vars.CONTENT_RELEASE_ENABLED == 'true' && vars.CONTENT_EMERGENCY_STOP != 'true' }}
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 - this lane runs validate:structural, which now includes
      # validate:cadence-policy, and that measures committed registry history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Run bounded search intelligence loop
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL_SEATING: ${{ secrets.GSC_SITE_URL_SEATING }}
          GSC_SITE_URL_BUDGET: ${{ secrets.GSC_SITE_URL_BUDGET }}
          GSC_SITE_URL_TIMELINE: ${{ secrets.GSC_SITE_URL_TIMELINE }}
          GSC_SITE_URL_CHECKLIST: ${{ secrets.GSC_SITE_URL_CHECKLIST }}
        # The citation probe (search:citations) used to run inside this cycle
        # every day on a paid model plus the OpenRouter web plugin. Owner
        # policy, 11 Oct 2026: "nothing should be paid" - it is out of
        # search:cycle and lives in citation-probe.yml, dispatch only, behind
        # confirm_paid. No provider key reaches this step any more.
        run: npm run search:cycle
      # The $0 router's health check: live pricing of every configured model is
      # still $0 and one free model answers (log line LLM_ROUTER_RECEIPT). A
      # dead key is the named stop CREDENTIAL_REFUSED and the cycle stays green.
      - name: Free model router check ($0 only)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm run llm:check
      - name: Re-run structural validation after any bounded repair
        run: npm run validate:structural
      - name: Commit evidence and bounded repairs only
        run: |
          git config user.name 'dream-wedding-search-intelligence-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/search_intelligence data/seo/hub_pages.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'search: evidence-backed bounded repair cycle'
          # Push back to the ref this run was started from. On the schedule that
          # is main, unchanged. On a workflow_dispatch from a branch it is that
          # branch - the previous 'HEAD:main' meant any dispatch used to test a
          # change on a branch wrote its evidence straight to main.
          # Fetch, rebase, bounded retry, and "the ref already contains HEAD" is
          # success - a bare `git push` turned a fully green Full Safe Autonomy run
          # red on 2026-09-15 for a push that had landed (run 34957914196).
          scripts/ci/push_back.sh "$GITHUB_REF_NAME"
