name: Search Intelligence - Observe Diagnose Repair Retest
on:
  workflow_dispatch:
  schedule:
    - cron: '41 11 * * *'
permissions:
  contents: write
concurrency:
  group: dream-wedding-search-intelligence
  cancel-in-progress: false
jobs:
  search-intelligence:
    if: ${{ vars.CONTENT_RELEASE_ENABLED == 'true' && vars.CONTENT_EMERGENCY_STOP != 'true' }}
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 - this lane runs validate:structural, which now includes
      # validate:cadence-policy, and that measures committed registry history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Run bounded search intelligence loop
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL_SEATING: ${{ secrets.GSC_SITE_URL_SEATING }}
          GSC_SITE_URL_BUDGET: ${{ secrets.GSC_SITE_URL_BUDGET }}
          GSC_SITE_URL_TIMELINE: ${{ secrets.GSC_SITE_URL_TIMELINE }}
          GSC_SITE_URL_CHECKLIST: ${{ secrets.GSC_SITE_URL_CHECKLIST }}
          # The citation probe. It self-throttles to one measured run a week
          # (min_hours_between_runs in data/search_intelligence/config.json)
          # because the web plugin bills per result, and holds with a named
          # HELD_CADENCE state in between rather than reporting an empty run.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm run search:cycle
      - name: Re-run structural validation after any bounded repair
        run: npm run validate:structural
      - name: Commit evidence and bounded repairs only
        run: |
          git config user.name 'dream-wedding-search-intelligence-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/search_intelligence data/seo/hub_pages.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'search: evidence-backed bounded repair cycle'
          # Push back to the ref this run was started from. On the schedule that
          # is main, unchanged. On a workflow_dispatch from a branch it is that
          # branch - the previous 'HEAD:main' meant any dispatch used to test a
          # change on a branch wrote its evidence straight to main.
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
