name: Full Safe Autonomy
on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'
permissions:
  contents: write
concurrency:
  group: dream-wedding-authority
  cancel-in-progress: false
jobs:
  authority:
    if: ${{ vars.CONTENT_RELEASE_ENABLED == 'true' && vars.CONTENT_EMERGENCY_STOP != 'true' }}
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because scripts/seo/build_lastmod_ledger.mjs derives every
      # lastmod by walking committed history for the content that renders each
      # path. Under the default depth-1 checkout there is no history to walk, so
      # every path resolved to the single available commit and the ledger this
      # lane committed on 2026-08-27 gave all 103 URLs the same date - the exact
      # fabricated freshness signal the ledger exists to remove, and a failing
      # tests/unit/lastmod-ledger.test.ts that only CI (a full checkout) could
      # see. Rebuilt from real history the same content yields four distinct
      # dates.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run authority:yield:build
      - run: npm run authority:scale:fanout
      - run: npm run authority:scale:restore
      # restore re-adds any frozen record whose slug is missing from the registry.
      # That is how a deleted skeleton comes back, so the registry is checked here,
      # before publish gets a chance to add more.
      - run: npm run validate:authority-registry
      # Publish composes guides from the authored seeds in
      # data/authority/editorial_seeds.json. Three outcomes, and only one is red:
      # it published something, it had nothing ready and says so, or the seed file
      # is malformed. "Nothing ready" exits 0 - a quiet green run that published no
      # pages because none were authored is the correct result, and the previous
      # behaviour (refuse, exit 1, fail every day) trained everyone to ignore this
      # job. Topics that still need writing are listed in the authoring queue below
      # rather than being silently dropped.
      - name: Publish authored guides
        run: npm run authority:scale:publish
      # The publish step's outcome is named, not inferred. publish-outcome.json
      # carries one of PUBLISHED / HELD_* / EDITORIAL_SEEDS_INVALID, the reason,
      # and what would unblock it. This step fails the run if that file is
      # missing or carries an unrecognised code, so "published 0" can never
      # again be indistinguishable from "did nothing and said nothing".
      - name: Name the publish outcome
        if: always()
        run: |
          node -e "
          const fs=require('fs');
          const p='artifacts/authority/publish-outcome.json';
          if(!fs.existsSync(p)){console.error('publish step produced no outcome receipt at '+p);process.exit(1)}
          const o=JSON.parse(fs.readFileSync(p,'utf8'));
          const known=Object.keys(o.outcome_codes||{}).concat(['EDITORIAL_SEEDS_INVALID']);
          console.log('publish outcome: '+o.outcome+' ('+o.outcome_kind+')');
          console.log('reason: '+o.outcome_reason);
          console.log('unblocked by: '+o.unblocked_by);
          const b=o.authoring_backlog||{};
          if(b.topics)console.log('authoring backlog: '+b.topics+' topic(s) need three sentences each ('+(b.sentences_required_each||[]).join(', ')+') - see '+b.file);
          for(const t of b.next||[])console.log('  needs authoring: '+t.topic+'  ->  cluster '+t.cluster+', hub '+t.hub_route);
          if(o.outcome!=='EDITORIAL_SEEDS_INVALID'&&!known.includes(o.outcome)){console.error('unnamed publish outcome: '+o.outcome);process.exit(1)}
          "
      - run: npm run validate:authority-registry
      - run: npm run authority:atlas
      - run: npm run authority:flow
      - run: npm run authority:sitemaps
      - run: npm run distribution:prepare
      - run: npm run distribution:validate
      # Build before the gate, because one of the gates is a crawl.
      #
      # ROOT CAUSE of every red scheduled run from 2026-09-03 onward. PR #9 added
      # the internal-link-graph validator, a HARD_FAIL that boots the built app,
      # fetches each host's real sitemap and reads the anchors out of the returned
      # HTML. It is marked `requires_build: true` and hard-fails when .next is
      # absent, deliberately: a link-graph gate that passed without crawling
      # anything would be the empty-loop pass this repo keeps rediscovering.
      #
      # That PR added `npm run build` to ci.yml and to self-heal.yml and missed
      # this file - the only other lane that reaches the registry, via `npm run
      # selfheal`. So this job asked for a crawl it had given nothing to crawl,
      # every night at 10:17. It was not a content defect: at a95501e with a build
      # present the same gate reports 118 sitemap URLs across 4 hosts and 0
      # orphans. The build is the fix; nothing about the assertion changes.
      #
      # validate_repair_contract.mjs now fails if any lane reaching a
      # requires_build validator has no build ahead of it, so the next validator
      # of this class cannot be added to one lane and forgotten in another.
      - run: npm run build

      # Repair before the gate, not instead of it.
      #
      # scripts/selfheal/heal_until_clean.mjs is a real bounded
      # validate -> repair -> revalidate loop, and until now the publishing lane
      # never called it: it lived only in self-heal.yml, whose cron
      # ('18 16 * * 3') has never fired and which has run exactly once ever, by
      # hand. So a content failure in the lane that actually publishes had no
      # repair path at all, even for the validators that name the command that
      # fixes them in _repo_validation_registry.json.
      #
      # It exits 0 only when `npm run validate:all` is green, and exits 1 with a
      # named result otherwise - NO_REPAIR_AVAILABLE when nothing failing has a
      # registered repair, GATE_DISAGREES when the gate and the attributed checks
      # disagree. Neither is healed away silently, and validate:structural still
      # runs afterwards as the unhealed gate.
      - name: Repair then revalidate (bounded)
        id: heal
        run: npm run selfheal
      - name: Name the heal outcome
        if: always()
        run: |
          node -e "
          const fs=require('fs');
          const p='reports/validation/self-heal-loop.json';
          if(!fs.existsSync(p)){console.log('self-heal produced no report');process.exit(0)}
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          console.log('self-heal: '+r.status+' (safe_to_push='+r.safe_to_push+')');
          for(const a of r.attempts||[]){
            console.log('  attempt '+a.attempt+': '+a.result+(a.failed.length?' failed=['+a.failed.join(', ')+']':''));
            for(const [id,text] of Object.entries(a.manual||{}))console.log('  fix by hand: '+id+' - '+text);
          for(const [id,cmd] of Object.entries(a.unrunnable_repairs||{}))console.error('  registry defect: '+id+' repair_command is not runnable: '+cmd);
          if(a.result==='NO_REPAIR_AVAILABLE')console.error('  no automated repair for: '+a.failed.join(', ')+' - add a repair_command in _repo_validation_registry.json, or a manual_repair if no script can fix it');
          }
          const lines=['## self-heal: '+r.status+' (safe_to_push='+r.safe_to_push+')'];
          for(const a of r.attempts||[]){
            lines.push('- attempt '+a.attempt+': **'+a.result+'**'+(a.failed.length?' failed: '+a.failed.join(', '):''));
            for(const [id,text] of Object.entries(a.manual||{}))lines.push('  - fix by hand - **'+id+'**: '+text);
            for(const [id,cmd] of Object.entries(a.unrunnable_repairs||{}))lines.push('  - registry defect - **'+id+'** repair_command is not runnable: `'+cmd+'`');
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY||'/dev/stdout', lines.join('\\n')+'\\n');
          "
      - run: npm run validate:structural
      - run: npm run authority:scale:freeze
      - run: npm run authority:scale:validate
      # Close the derivation loop before the gate reads the policy.
      #
      # data/cadence/policy.json carries refresh_capacity_per_week and
      # new_pages_per_week, both derived from measured throughput and then stored
      # as literals. Until 2026-08-29 no workflow ran derive_capacity.mjs, so the
      # literals never moved while the rate they came from did: under a simulated
      # clock the stored 11/5 becomes 7/3 by 2026-09-20, i.e. the publisher
      # releasing five guides a week against a measured sustainable three, and
      # cadence_gate.js computing maintainable_ceiling from a rate the repo no
      # longer achieved. Re-deriving here means the gate below is measured against
      # today's history, and data/cadence is already staged by the commit step.
      - name: Re-derive cadence capacity from measured history
        run: npm run cadence:derive -- --write
      # The cadence policy is enforced against the publisher, not only against CI.
      # data/cadence/policy.json carries numbers measured by
      # scripts/cadence/derive_capacity.mjs from this repo's own history; without
      # this step the cron could publish past them all week and only discover it on
      # the next push. Blocking conditions here are real data problems.
      - run: npm run cadence:gate
      # Last gate before the first push to main. validate:structural above already
      # includes this check; it is repeated here so the thing standing between a
      # skeleton and origin/main is a named step rather than a member of a composite.
      - run: npm run validate:authority-registry
      - name: Commit governed authority changes
        run: |
          git config user.name 'dream-wedding-authority-bot'
          git config user.email 'actions@users.noreply.github.com'
          # data/seo carries lastmod_ledger.json, which authority:sitemaps rebuilds
          # from the content this run generated. Without it staged, the ledger would be
          # regenerated in CI and thrown away, and the deployed sitemap would keep
          # serving the previous run's dates.
          # data/cadence carries known_urls.json, the record of which URLs existed at
          # the last gate run. The cron publishes but never used to commit it, so the
          # ledger went stale and the next CI push saw a week of accumulated pages as
          # one oversized batch. data/seo carries route_ownership.json, which publish
          # now writes so a new guide has a host to be served from, and
          # lastmod_ledger.json rebuilt by authority:sitemaps.
          # data/atlas and data/search_intelligence are here because the heal
          # step's registered repairs (atlas:build, search:diagnose,
          # search:repair) write there. A repair that is not committed is a
          # repair that runs again tomorrow.
          git add data/authority data/authority_scale data/cadence data/release data/seo data/atlas data/search_intelligence artifacts/authority artifacts/sitemaps artifacts/distribution reports/cadence reports/validation 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'authority: governed daily content expansion'
          # Push back to the ref the run started from. On the schedule that is
          # main. A workflow_dispatch from a branch used to push that branch's
          # content straight to main, which made testing a change to this lane
          # impossible without releasing it.
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Submit IndexNow and Google Search Console after validated publication
        env:
          RUN_MODE: live
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL_SEATING: ${{ secrets.GSC_SITE_URL_SEATING }}
          GSC_SITE_URL_BUDGET: ${{ secrets.GSC_SITE_URL_BUDGET }}
          GSC_SITE_URL_TIMELINE: ${{ secrets.GSC_SITE_URL_TIMELINE }}
          GSC_SITE_URL_CHECKLIST: ${{ secrets.GSC_SITE_URL_CHECKLIST }}
        run: |
          npm run distribution:indexnow
          npm run distribution:gsc
      - name: Commit distribution receipts
        run: |
          git add artifacts/distribution 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'authority: record distribution receipts'
          # Push back to the ref the run started from. On the schedule that is
          # main. A workflow_dispatch from a branch used to push that branch's
          # content straight to main, which made testing a change to this lane
          # impossible without releasing it.
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: authority-release-evidence
          path: |
            artifacts/authority/
            artifacts/sitemaps/
