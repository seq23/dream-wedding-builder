name: Full Safe Autonomy
on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'
permissions:
  contents: read
concurrency:
  group: dream-wedding-authority
  cancel-in-progress: false
jobs:
  authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run authority:atlas
      - run: npm run authority:flow
      - run: npm run authority:sitemaps
      - run: npm run validate:structural
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authority-release-evidence
          path: |
            artifacts/authority/
            artifacts/sitemaps/
