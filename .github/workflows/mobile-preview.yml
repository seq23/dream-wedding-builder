name: App preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'lib/**', '.github/workflows/mobile-preview.yml']
  pull_request:
    paths: ['apps/mobile/**', 'lib/**', '.github/workflows/mobile-preview.yml']
permissions:
  contents: read
concurrency:
  group: app-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/mobile
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_DW_PREVIEW: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run preview:web
      - uses: actions/upload-artifact@v4
        id: preview
        with:
          name: phone-web-preview
          path: apps/mobile/dist
          if-no-files-found: error
      - name: Free preview shortcut
        run: |
          echo "[Download the phone web preview](${{ steps.preview.outputs.artifact-url }}). Unzip, run python3 -m http.server 8080 inside it, then open http://localhost:8080 in a phone-sized browser. No Appetize minutes or store account required." >> "$GITHUB_STEP_SUMMARY"
