name: App preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'lib/**', '.github/workflows/mobile-preview.yml']
  pull_request:
    paths: ['apps/mobile/**', 'lib/**', '.github/workflows/mobile-preview.yml']
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: app-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/mobile
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_DW_PREVIEW: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run preview:web
      - uses: actions/upload-artifact@v4
        id: preview
        with:
          name: phone-web-preview
          path: apps/mobile/dist
          if-no-files-found: error
      - name: Host free phone preview
        id: hosted
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_PROJECT: dream-wedding-app-preview
          PREVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: bash scripts/preview/host.sh
      - name: Link preview on the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.hosted.outputs.url }}
        run: |
          gh pr comment "$PR_NUMBER" --body "Phone preview for $GITHUB_SHA: $PREVIEW_URL"
