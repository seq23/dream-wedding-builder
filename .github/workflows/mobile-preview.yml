name: App preview
on:
  workflow_dispatch:
  push:
  pull_request: {}
permissions:
  contents: read
  pull-requests: write
concurrency:
  # One group per branch: the push run and the pull_request run of one commit publish the
  # same preview branch, and racing each other one fails PREVIEW_HOST_FAILED (PR #240,
  # 18 Nov 2026). They queue instead of cancelling, so neither shows as a cancelled check.
  group: app-preview-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    environment: reviewed-main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      url: ${{ steps.hosted.outputs.url }}
    defaults:
      run:
        working-directory: apps/mobile
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_DW_PREVIEW: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: node --test scripts/preview/host.unit.mjs
      - run: npm run preview:web
      - uses: actions/upload-artifact@v4
        id: preview
        with:
          name: phone-web-preview
          path: apps/mobile/dist
          if-no-files-found: error
      - name: Publish free phone preview
        id: hosted
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: node scripts/preview/host.mjs dream-wedding-app-preview
      - name: Link preview on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.hosted.outputs.url }}
        with:
          script: |
            const body = `Open the phone app preview: ${process.env.PREVIEW_URL}\n\nCommit: ${context.sha}. Free web preview; no Appetize minutes.`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
  # THE TAP-THROUGH (ship-ready app-review.md, required for any PR that changes a screen): a robot taps
  # through this preview like a person, at 390 px light and dark, from tap-through.json. Red on a dead
  # button, a console error, an error screen, an unreachable step or a full-plan promise with no screen
  # behind it. Free (public repo); every write is blocked, nothing real is touched.
  tap-through:
    needs: preview
    uses: seq23/boss-os/.github/workflows/tap-through.yml@feat/tap-through
    with:
      target: ${{ needs.preview.outputs.url }}
      runner_ref: feat/tap-through  # until seq23/boss-os#509 lands; then this line and the @ref go to main
