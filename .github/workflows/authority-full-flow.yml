name: Authority - Full Safe Autonomy
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
permissions: { contents: read }
concurrency: { group: dwb-authority-full-flow, cancel-in-progress: false }
jobs:
  authority:
    if: ${{ vars.CONTENT_RELEASE_ENABLED == 'true' && vars.CONTENT_EMERGENCY_STOP != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - run: npm run validate:authority
      - name: Safe-harbor boundary
        run: echo 'Discovery/generation adapters admit only unique, supported, product-relevant routes scoring >= 9.0; unsupported work is skipped and recorded.'
